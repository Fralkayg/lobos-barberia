<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Lobo's Barbería Tradicional</title>
    <!--
      GitHub Pages has no server-side rewrites, so a hard refresh (or a
      shared link) on a route like /reservar 404s. This redirects the 404
      back to index.html, encoding the original path in the query string so
      main.tsx can restore it before React Router reads the URL.
      Technique: https://github.com/rafgraph/spa-github-pages
      If you ever deploy to a custom domain at the root (not /lobos-barberia/),
      change pathSegmentsToKeep to 0.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
