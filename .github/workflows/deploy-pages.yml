name: Deploy frontend to GitHub Pages

# Publishes client/ (the React app) to GitHub Pages. The booking API/Excel
# backend in server/ is NOT static and does not deploy here — it needs its
# own host (Render, Railway, Fly.io, a VPS, etc). Set the VITE_API_URL
# repository variable (Settings → Secrets and variables → Actions →
# Variables) to that backend's public URL before relying on the booking
# flow; otherwise the site deploys but booking/services/team data won't load.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          # Repo name -> Pages project-site base path (https://<user>.github.io/lobos-barberia/).
          VITE_BASE_PATH: /lobos-barberia/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
