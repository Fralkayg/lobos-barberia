name: Deploy frontend to GitHub Pages

# Publishes client/ (the React app) to GitHub Pages. There is no backend to
# host separately: the site talks directly to Google Sheets (reads) and a
# Google Form (writes) — see docs/google-sheets-setup.md. Fill in
# client/src/config/sheets.ts with your spreadsheet/form IDs before the
# booking flow will have real data to show.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          # Repo name -> Pages project-site base path (https://<user>.github.io/lobos-barberia/).
          VITE_BASE_PATH: /lobos-barberia/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
